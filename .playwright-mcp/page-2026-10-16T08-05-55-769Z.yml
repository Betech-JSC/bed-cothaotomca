                - heading "Hải sản loại 1" [level=3]
                - paragraph: Sự khác biệt của chúng tôi bắt đầu từ tiêu chuẩn đầu vào vô cùng khắt khe. Chỉ những mẻ tôm, cua, cá, ghẹ xuất sắc nhất mới được lựa chọn để chế biến tại bếp Cô Thảo Tôm Cá. Mỗi món đều được hoàn thiện với công thức nước tương độc quyền — được nghiên cứu và phát triển riêng biệt cho từng loại hải sản, từ nguyên liệu, cách nấu đến thời gian ủ, nhằm tôn lên trọn vẹn hương vị tự nhiên của từng thành phần.
