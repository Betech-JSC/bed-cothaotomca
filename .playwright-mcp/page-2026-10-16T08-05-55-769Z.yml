              - paragraph [ref=e121]: Hơn nửa thập kỷ tiên phong đưa hương vị hải sản tươi ngâm tương Hàn Quốc đến bàn ăn thực khách Việt, Cô Thảo Tôm Cá tự hào là một trong những đơn vị đặt những bước đi đầu tiên, mang đến làn gió ẩm thực mới mẻ cho giới trẻ. Một hành trình được xây dựng vững chắc từ sự công nhận và tin tưởng tuyệt đối của khách hàng.
